name: Build release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin
            arch: arm64
          - runner: windows-2022
            target: windows
            arch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:go
      - name: Check for data races
        if: runner.os == 'macOS'
        run: npm run test:race
      - name: Build and package
        run: npm run release -- ${{ matrix.target }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            build/releases/*.zip
            build/releases/*.dmg
            build/releases/*.exe
            build/releases/LICENSE.txt
            build/releases/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Prepare draft release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Generate checksums and upload assets
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mac="Quillweave-${version}-macos-arm64"
          windows="Quillweave-${version}-windows-amd64"
          assets=("$mac.dmg" "$windows.exe" "$mac.zip" "$windows.zip" LICENSE.txt THIRD_PARTY_NOTICES.txt)
          for asset in "${assets[@]}"; do test -f "$asset"; done
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/quillweave-release-state"; then
            test "$(cat "$RUNNER_TEMP/quillweave-release-state")" = true
            gh release upload "$RELEASE_TAG" "${assets[@]}" SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" SHA256SUMS.txt \
              --verify-tag --draft --prerelease \
              --title "Quillweave $RELEASE_TAG" \
              --notes "Preview desktop release. Download the macOS Apple Silicon DMG or Windows x64 EXE. ZIP packages and license notices are also attached. The Windows EXE embeds the license notices. macOS uses ad-hoc signing. Review the checksums and test both applications before publishing."
          fi
